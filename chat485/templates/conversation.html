<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat485</title>
</head>
<body>
    <aside>
        <a href="/">Chat485</a>
        <a href="/">New chat</a>
        <ul>
            {% for conv in conversations %}
            <li>
                <a href="/conversations/{{ conv.uuid }}/" {% if conv.uuid == current_uuid %}aria-current="page"{% endif %}>
                    {{ conv.title }}
                </a>
            </li>
            {% endfor %}
        </ul>
        <p>{{ user }}</p>
    </aside>

    <main>
        {% if show_older %}
        <p>Load older messages</p>
        {% endif %}

        <section>
            {% for msg in messages %}
            <div>
                <span>{{ msg.role }}</span>
                <p>{{ msg.content }}</p>
            </div>
            {% endfor %}
        </section>

        <form>
            <select name="model">
                {% for m in models %}
                <option value="{{ m }}" {% if m == "echo-1" %}selected{% endif %}>{{ m }}</option>
                {% endfor %}
            </select>
            <button type="submit">Send</button>
        </form>
    </main>
</body>
</html>
